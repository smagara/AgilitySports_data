name: agilitysports-V2-test-sql-db

services:
  sqlserver:
    image: ${SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
    ports:
      - "${HOST_SQL_PORT:-21433}:1433"
    volumes:
      - db_v2_data:/var/opt/mssql
      - ./database:/docker-init/database:ro
      - ./security:/docker-init/security:ro
      - ./schema:/docker-init/schema:ro
      - ./seed:/docker-init/seed:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  init-db-image:
    image: ${SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
      AGILITY_DB_NAME: ${AGILITY_DB_NAME:-AgilitySports}
      AGILITY_TEST_LOGIN: ${AGILITY_TEST_LOGIN}
      AGILITY_TEST_PASSWORD: ${AGILITY_TEST_PASSWORD}
    volumes:
      - ./database:/docker-init/database:ro
      - ./security:/docker-init/security:ro
      - ./schema:/docker-init/schema:ro
      - ./seed:/docker-init/seed:ro
    command: >
      /bin/bash -c '
      set -e;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d master -b -v AZURE_SQL_DATABASE="$${AGILITY_DB_NAME}" -i /docker-init/database/001-create-database.sql;
      echo "Docker Database creation complete.";
      echo "Waiting for database [$${AGILITY_DB_NAME}] to become ONLINE...";
      for i in $$(seq 1 60); do
        if /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -Q "SELECT 1" >/dev/null 2>&1; then
          echo "Database [$${AGILITY_DB_NAME}] is ONLINE.";
          break;
        fi;
        if [ "$$i" -eq 60 ]; then
          echo "Database [$${AGILITY_DB_NAME}] did not become ONLINE in time.";
          exit 1;
        fi;
        sleep 2;
      done;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d master -b -v AZURE_SQL_DATABASE="$${AGILITY_DB_NAME}" AGILITY_TEST_USER="$${AGILITY_TEST_LOGIN}" TEST_USER_PASSWORD="$${AGILITY_TEST_PASSWORD}" -i /docker-init/security/002-security.sql;
      echo "Docker Database Security complete.";
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" TEST_USER_LOGIN="$${AGILITY_TEST_LOGIN}" -i /docker-init/schema/101-ddl.V2.schemas.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" TEST_USER_LOGIN="$${AGILITY_TEST_LOGIN}" -i /docker-init/schema/102-ddl.V2.Sports.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" TEST_USER_LOGIN="$${AGILITY_TEST_LOGIN}" -i /docker-init/schema/103-ddl.V2.PositionsCodes.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" TEST_USER_LOGIN="$${AGILITY_TEST_LOGIN}" -i /docker-init/schema/104-ddl.V2.Teams.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" TEST_USER_LOGIN="$${AGILITY_TEST_LOGIN}" -i /docker-init/schema/105-ddl.V2.Players.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" TEST_USER_LOGIN="$${AGILITY_TEST_LOGIN}" -i /docker-init/schema/106-ddl.V2.MLBPlayerStats.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" TEST_USER_LOGIN="$${AGILITY_TEST_LOGIN}" -i /docker-init/schema/107-ddl.V2.NBAPlayerStats.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" TEST_USER_LOGIN="$${AGILITY_TEST_LOGIN}" -i /docker-init/schema/108-ddl.V2.NFLPlayerStats.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" TEST_USER_LOGIN="$${AGILITY_TEST_LOGIN}" -i /docker-init/schema/109-ddl.V2.NHLPlayerStats.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" TEST_USER_LOGIN="$${AGILITY_TEST_LOGIN}" -i /docker-init/schema/110-ddl.V2.FIFPlayerStats.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" TEST_USER_LOGIN="$${AGILITY_TEST_LOGIN}" -i /docker-init/schema/115-ddl.V2.Attendance.sql;
      echo "Docker Database Schema complete.";
      if command -v dos2unix >/dev/null 2>&1; then
        cp /docker-init/schema/120-sprocs.sql /tmp/120-sprocs.sql;
        dos2unix /tmp/120-sprocs.sql;
      else
        sed "s/\r$//" /docker-init/schema/120-sprocs.sql > /tmp/120-sprocs.sql;
      fi;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" TEST_USER_LOGIN="$${AGILITY_TEST_LOGIN}" -i /tmp/120-sprocs.sql;
      echo "Docker Database Sprocs complete.";
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" -i /docker-init/seed/201-seed_reference_sports.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" -i /docker-init/seed/202-seed_reference_PositionCodes.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" -i /docker-init/seed/203-seed_core_Teams.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" -i /docker-init/seed/204-seed_core_players.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" -i /docker-init/seed/205-seed_stats_MLBPlayerStats.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" -i /docker-init/seed/206-seed_stats_NHLPlayerStats.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" -i /docker-init/seed/207-seed_stats_Attendance.sql;
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d "$${AGILITY_DB_NAME}" -b -v DB_NAME="$${AGILITY_DB_NAME}" -i /docker-init/seed/208-seed_stats_FIFPlayerStats.sql;
      echo "Docker Database Seeding complete.";
      '
    restart: "no"

volumes:
  db_v2_data: