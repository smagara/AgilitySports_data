name: Execute Azure SQL Code

on:
  push:
    branches:
      - main

jobs:
  run-sql:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository to access the files
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch the full history to ensure HEAD~1 is valid

      # Step 2: Install SQL tools
      - name: Install SQL tools
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools unixodbc-dev
          echo 'export PATH="$PATH:/opt/mssql-tools/bin"' >> ~/.bashrc
          source ~/.bashrc

      # Step 3: Detect changed SQL files and execute them
      - name: Execute changed SQL scripts
        env:
          AZURE_SQL_USER: ${{ secrets.AZURE_SQL_USER }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AGILITY_TEST_USER: ${{ secrets.AGILITY_TEST_USER }}
          
        shell: bash
        run: |
          set -uo pipefail

          # Initialize a log file
          LOG_FILE="execution_log.txt"
          echo "SQL Execution Log - $(date)" > $LOG_FILE

          FAILED=0
          RAN_COUNT=0

          # Get the list of changed files
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            # If no previous commit, consider all files in the repository
            CHANGED_FILES=$(git ls-files)
          fi

          # Keep only SQL files
          mapfile -t SQL_FILES < <(printf '%s\n' "$CHANGED_FILES" | grep -Ei '\.sql$' || true)
          if [ ${#SQL_FILES[@]} -eq 0 ]; then
            echo "No changed SQL files found."
            echo "No changed SQL files found." | tee -a $LOG_FILE
            cat $LOG_FILE
            exit 0
          fi

          # Filter for .sql files and execute them
          for file in "${SQL_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Execution of $file failed: file does not exist." | tee -a $LOG_FILE
              echo "::error file=$file::SQL file does not exist in workspace."
              FAILED=1
              continue
            fi

            echo "Executing $file" | tee -a $LOG_FILE

            TMP_OUT="$(mktemp)"

            # bash -e would exit immediately on non-zero sqlcmd; capture status manually.
            set +e
            /opt/mssql-tools/bin/sqlcmd \
              -S "$AZURE_SQL_SERVER" \
              -d "$AZURE_SQL_DATABASE" \
              -U "$AZURE_SQL_USER" \
              -P "$AZURE_SQL_PASSWORD" \
              -b \
              -r1 \
              -i "$file" > "$TMP_OUT" 2>&1
            SQLCMD_EXIT=$?
            set -e

            cat "$TMP_OUT" >> "$LOG_FILE"
            RAN_COUNT=$((RAN_COUNT + 1))

            if [ $SQLCMD_EXIT -ne 0 ]; then
              echo "Execution of $file failed (sqlcmd exit $SQLCMD_EXIT)." | tee -a $LOG_FILE
              echo "::error file=$file::sqlcmd exited with code $SQLCMD_EXIT. See execution_log.txt for details."
              echo "--- Failure summary for $file ---"
              grep -Ein "^Msg [0-9]+|^Sqlcmd: Error|Invalid filename|cannot open|No such file or directory" "$TMP_OUT" | head -n 20 || true
              echo "--- Last 40 lines of sqlcmd output for $file ---"
              tail -n 40 "$TMP_OUT" || true
              FAILED=1
            fi

            if grep -Eiq "Invalid filename|cannot open|No such file or directory" "$TMP_OUT"; then
              echo "Execution of $file failed (include/path resolution error)." | tee -a $LOG_FILE
              echo "::error file=$file::Include/path resolution error detected (for example: Invalid filename). Use POSIX paths in :r includes on Linux runners."
              FAILED=1
            fi

            rm -f "$TMP_OUT"
          done

          # Display the log file in the workflow logs
          cat $LOG_FILE

          echo "Executed SQL files: $RAN_COUNT"

          if [ $FAILED -ne 0 ]; then
            echo "One or more SQL scripts failed. Failing job."
            exit 1
          fi
